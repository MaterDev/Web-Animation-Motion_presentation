<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>design — web animation &amp; motion</title>
<link rel="stylesheet" href="system/fonts.css">
<link rel="stylesheet" href="system/tokens.css">
<style>
/* Sidebar + iframe harness. Same shape as the old multi-treatment
   switcher, but the list is now grouped — Reference (the T-06
   system sheet, the layouts gallery) and Techniques (one page per
   SCOPE.md spectrum stage) — instead of parallel design variations.
   T-01–T-05 stay archived on disk; this shell only points at T-06. */

html, body { height: 100%; margin: 0; }

body {
  display: grid;
  grid-template-columns: 264px 1fr;
  background: var(--hz-000);
  color: var(--hz-600);
  font-family: var(--sans);
  font-size: 14px;
  overflow: hidden;
}

/* ── sidebar ─────────────────────────────────────────── */

.rail { display: flex; flex-direction: column; border-right: var(--hair) solid var(--hz-300); background: var(--hz-050); overflow: hidden; }
.rail-head { padding: 18px 18px 16px; border-bottom: var(--hair) solid var(--hz-300); }
.rail-code { font-family: var(--mono); font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--hz-400); margin-bottom: 8px; }
.rail-title { font-size: 15px; font-weight: 500; letter-spacing: -0.01em; color: var(--hz-800); line-height: 1.3; }
.rail-sub { font-family: var(--mono); font-size: 10.5px; color: var(--hz-400); margin-top: 6px; line-height: 1.5; }

.rail-label { font-family: var(--mono); font-size: 9.5px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--hz-400); padding: 16px 18px 8px; }
.list { list-style: none; margin: 0; padding: 0 10px; overflow-y: auto; flex: 1; }

.item {
  width: 100%; display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: baseline;
  padding: 10px 10px; border: 0; border-radius: 5px; background: transparent;
  color: var(--hz-500); font: inherit; text-align: left; cursor: pointer;
  transition: background 160ms var(--ease-standard), color 160ms var(--ease-standard);
}
.item:hover { background: var(--hz-100); color: var(--hz-600); }
.item[aria-current='true'] { background: var(--hz-200); color: var(--hz-800); }
.item-code { font-family: var(--mono); font-size: 10px; color: var(--ct, var(--hz-400)); letter-spacing: 0.04em; }
.item[aria-current='true'] .item-code { color: var(--ct, var(--hz-600)); }
.item-name { font-size: 13px; line-height: 1.35; }
.item-note { grid-column: 2; font-family: var(--mono); font-size: 10px; color: var(--hz-400); margin-top: 3px; line-height: 1.45; }

.rail-foot { border-top: var(--hair) solid var(--hz-300); padding: 12px 18px 14px; font-family: var(--mono); font-size: 10px; color: var(--hz-400); line-height: 1.7; }
.rail-foot kbd { font-family: var(--mono); font-size: 9.5px; background: var(--hz-100); border: var(--hair) solid var(--hz-300); border-radius: 3px; padding: 1px 4px; color: var(--hz-500); }

/* ── stage ───────────────────────────────────────────── */

.stage { display: flex; flex-direction: column; overflow: hidden; background: radial-gradient(var(--hz-200) 0.5px, transparent 0.5px) 0 0 / 8px 8px, var(--hz-000); }
.bar { display: flex; align-items: center; gap: 14px; padding: 0 16px; height: 44px; border-bottom: var(--hair) solid var(--hz-300); background: var(--hz-050); flex: none; }
.bar-title { font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--hz-500); }
.bar-spacer { flex: 1; }

.seg { display: flex; border: var(--hair) solid var(--hz-300); border-radius: 5px; overflow: hidden; }
.seg button { border: 0; background: transparent; color: var(--hz-500); font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.06em; padding: 5px 11px; cursor: pointer; transition: background 160ms var(--ease-standard), color 160ms var(--ease-standard); }
.seg button + button { border-left: var(--hair) solid var(--hz-300); }
.seg button:hover { background: var(--hz-100); color: var(--hz-600); }
.seg button[aria-pressed='true'] { background: var(--hz-200); color: var(--hz-800); }

.btn { border: var(--hair) solid var(--hz-300); border-radius: 5px; background: transparent; color: var(--hz-500); font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.06em; padding: 5px 11px; cursor: pointer; text-decoration: none; transition: background 160ms var(--ease-standard), color 160ms var(--ease-standard); }
.btn:hover { background: var(--hz-100); color: var(--hz-800); }

.frame-wrap { flex: 1; overflow: auto; display: flex; justify-content: center; padding: 0; }
.frame-wrap[data-w='fit'] { padding: 0; }
.frame-wrap:not([data-w='fit']) { padding: 20px; }

iframe { border: 0; width: 100%; height: 100%; background: var(--hz-000); display: block; }
.frame-wrap:not([data-w='fit']) iframe { border: var(--hair) solid var(--hz-300); border-radius: 6px; box-shadow: 0 24px 60px oklch(0 0 0 / 0.5); height: auto; min-height: 100%; }
</style>
</head>
<body>

<nav class="rail" data-testid="nav-rail">
  <div class="rail-head">
    <div class="rail-code">WAM-2026 / DESIGN</div>
    <div class="rail-title">T-06 · Field Unit (Dark)</div>
    <div class="rail-sub">Kept base treatment. T-01–T-05 archived on<br>disk, off this list. See design/system/ for<br>the shared tokens + components.</div>
  </div>

  <ul class="list" id="list" data-testid="nav-list"></ul>

  <div class="rail-foot">
    <kbd>1</kbd>–<kbd>9</kbd> switch &nbsp; <kbd>R</kbd> reload<br>
    Add a page: edit <span style="color:var(--hz-500)">ITEMS</span> in index.html
  </div>
</nav>

<main class="stage">
  <div class="bar">
    <span class="bar-title" id="barTitle" data-testid="stage-title">—</span>
    <span class="bar-spacer"></span>
    <div class="seg" id="widths" data-testid="width-control">
      <button data-w="fit" aria-pressed="true">FIT</button>
      <button data-w="1920">1920</button>
      <button data-w="1440">1440</button>
      <button data-w="1280">1280</button>
    </div>
    <button class="btn" id="reload" data-testid="reload-button">RELOAD</button>
    <a class="btn" id="popout" href="#" target="_blank" rel="noopener" data-testid="popout-link">OPEN ↗</a>
  </div>

  <div class="frame-wrap" id="wrap" data-w="fit">
    <iframe id="frame" title="Design page preview" data-testid="page-frame"></iframe>
  </div>
</main>

<script>
/* ─────────────────────────────────────────────────────────
   Item manifest, grouped. `ct` (optional) tints the item's code
   in the sidebar to match that technique's section tint, so the
   list itself previews the colour system before you click in.
   ───────────────────────────────────────────────────────── */
/* Same order as src/lib/sheets.js — the deck's own spectrum, not slide
   numbers. The two lists are duplicated on purpose: this page has to work as
   a standalone file with no build step, so it cannot import that module. A
   change to one is a change to both. */
const ITEMS = [
  { group: 'Reference', code: 'SYS', name: 'System', note: 'T-06 — the design system reference sheet', file: 'treatments/06-field-unit-dark.html' },
  { group: 'Reference', code: 'LAY', name: 'Layouts', note: 'Slide layout gallery, click a tile to preview', file: 'layouts/index.html' },
  { group: 'Reference', code: 'GFX', name: 'Graphic language', note: 'Per-topic tint + pixel symbol colour keys', file: 'graphic-language/index.html' },
  { group: 'Techniques', code: 'SL-06', name: 'Layout / CSS', note: 'Layout animated by selectors + scroll', file: 'techniques/css.html', ct: 'var(--tint-css)' },
  { group: 'Techniques', code: 'SL-10', name: 'SVG', note: 'Vector, DOM-based', file: 'techniques/svg.html', ct: 'var(--tint-svg)' },
  { group: 'Techniques', code: 'SL-11', name: '2D Canvas', note: 'Imperative pixel drawing', file: 'techniques/canvas.html', ct: 'var(--tint-canvas)' },
  { group: 'Techniques', code: 'SL-05', name: 'GIF', note: 'Baseline — pre-baked, no player', file: 'techniques/gif/index.html', ct: 'var(--tint-video)' },
  { group: 'Techniques', code: 'SL-04', name: 'Video', note: 'Baseline — pre-baked pixels', file: 'techniques/video/index.html', ct: 'var(--tint-video)' },
  { group: 'Techniques', code: 'SL-12', name: 'WebGL', note: 'GPU shaders, real 3D', file: 'techniques/webgl.html', ct: 'var(--tint-webgl)' },
  { group: 'Techniques', code: 'SL-14', name: 'WebGPU', note: 'Compute shaders', file: 'techniques/webgpu.html', ct: 'var(--tint-webgpu)' },
  { group: 'Techniques', code: 'SL-07', name: 'Composite', note: 'The closing argument — which surface carries which part', file: 'techniques/composite.html', ct: 'var(--tint-composite)' },
];

const list     = document.getElementById('list');
const frame    = document.getElementById('frame');
const barTitle = document.getElementById('barTitle');
const popout   = document.getElementById('popout');
const wrap     = document.getElementById('wrap');

let active = 0;

function render() {
  list.innerHTML = '';
  let lastGroup = null;
  ITEMS.forEach((t, i) => {
    if (t.group !== lastGroup) {
      const label = document.createElement('div');
      label.className = 'rail-label';
      label.textContent = t.group;
      list.appendChild(label);
      lastGroup = t.group;
    }
    const li = document.createElement('li');
    const b  = document.createElement('button');
    b.className = 'item';
    b.type = 'button';
    b.style.setProperty('--ct', t.ct || '');
    b.setAttribute('aria-current', String(i === active));
    b.setAttribute('data-testid', `nav-item-${t.code.toLowerCase()}`);
    b.innerHTML =
      `<span class="item-code">${t.code}</span>` +
      `<span class="item-name">${t.name}</span>` +
      `<span class="item-note">${t.note}</span>`;
    b.addEventListener('click', () => select(i));
    li.appendChild(b);
    list.appendChild(li);
  });
}

function select(i) {
  active = i;
  const t = ITEMS[i];
  frame.src = t.file;
  barTitle.textContent = `${t.code} · ${t.name}`;
  popout.href = t.file;
  location.hash = t.code.toLowerCase();
  render();
}

document.getElementById('reload').addEventListener('click', () => {
  frame.src = frame.src;
});

document.getElementById('widths').addEventListener('click', (e) => {
  const btn = e.target.closest('button');
  if (!btn) return;
  const w = btn.dataset.w;
  wrap.dataset.w = w;
  frame.style.width = w === 'fit' ? '100%' : w + 'px';
  frame.style.maxWidth = w === 'fit' ? 'none' : '100%';
  [...e.currentTarget.children].forEach(c =>
    c.setAttribute('aria-pressed', String(c === btn)));
});

document.addEventListener('keydown', (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const n = parseInt(e.key, 10);
  if (n >= 1 && n <= ITEMS.length) select(n - 1);
  if (e.key.toLowerCase() === 'r') frame.src = frame.src;
});

const fromHash = ITEMS.findIndex(t => t.code.toLowerCase() === location.hash.slice(1));
select(fromHash >= 0 ? fromHash : 0);
</script>

</body>
</html>
