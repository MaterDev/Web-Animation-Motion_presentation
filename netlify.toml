# Netlify. The build is fully static (adapter-static), so this is
# just "run the build, publish the folder" — no functions, no edge
# runtime, nothing host-specific in the app itself.
#
# Deployed to Netlify project "wam-2026" by `bun run deploy`
# (scripts/deploy.sh), which builds locally and uploads build/. The
# [build] block below only runs if the site is ever connected to git
# for remote builds; the headers apply either way. render.yaml stays
# so the host remains swappable — nothing in the app depends on Netlify.

[build]
  command = "bun run build"
  publish = "build"

[build.environment]
  # Netlify provides Bun; pin the major so a remote build can't
  # silently move to a version the lockfile wasn't resolved against.
  BUN_VERSION = "1.3"

# Long-cache the content-hashed bundle. Everything under
# _app/immutable is fingerprinted by Vite, so it is safe to cache
# forever — a change produces a new filename.
[[headers]]
  for = "/_app/immutable/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The vendored fonts are not fingerprinted (they're copied verbatim
# so the standalone sheets can reference them at a stable path), so
# they get a long but not infinite cache.
[[headers]]
  for = "/sheets/vendor/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
