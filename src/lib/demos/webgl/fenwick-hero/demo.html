<!-- The Fenwick homepage hero, recomposed for the 864 × 444 slide well
     (2026-09-17). Source: design/techniques/webgl.html §1, hero panel 550–562.
     The stage is the whole panel; mast, copy and foot are DOM layers over it. -->
<div class="rl" data-testid="rl-world">
  <div class="rl-p rl-p-hero" data-v="hero" data-testid="rl-p-hero">
    <div class="rl-stage" data-testid="rl-stage">
      <canvas data-testid="rl-canvas"></canvas>
    </div>

    <header class="rlh-mast" data-testid="rl-hero-mast">
      <span class="rlh-brand" data-testid="rl-hero-brand">The Fenwick</span>
      <nav class="rlh-nav" data-testid="rl-hero-nav">
        <button type="button" data-testid="rl-hero-nav-visit">Visit</button>
        <button type="button" class="rl-on" data-testid="rl-hero-nav-collection">Collection</button>
        <button type="button" data-testid="rl-hero-nav-whats-on">What's on</button>
      </nav>
      <span class="rlh-open" data-testid="rl-hero-open">Open today <b>10:00–18:00</b></span>
    </header>

    <div class="rlh-copy" data-testid="rl-hero-copy">
      <span class="rlh-eyebrow" data-testid="rl-hero-eyebrow">New · the scanned collection</span>
      <h3 data-testid="rl-hero-title">The collection,<br>in the round</h3>
      <p data-testid="rl-hero-text">Three hundred objects, scanned. This bust is <span data-testid="rl-hero-count">320,000</span> points of light, and your pointer moves them.</p>
      <button class="rlh-cta" data-testid="rl-hero-cta">Explore the collection</button>
    </div>

    <footer class="rlh-foot" data-testid="rl-hero-foot">
      <span data-testid="rl-hero-attrib">Marble Bust 01 · Poly Haven · CC0</span>
      <span class="rlh-hint" data-testid="rl-hint">pointer = wind</span>
    </footer>
    <span class="rl-status" data-testid="rl-status">loading…</span>
  </div>
</div>
