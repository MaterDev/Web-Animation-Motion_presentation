<!-- The Fenwick · object in the round, recomposed for the 864 × 444 slide well
     (2026-09-17). Source: design/techniques/webgl.html §1, museum panel 442–475.
     The leader overlay, the two-ways comparison and the §1 bench are gone. -->
<div class="rl" data-testid="rl-world">
  <div class="rl-p rl-p-museum" data-v="museum" data-testid="rl-p-museum">
    <header class="rlm-mast" data-testid="rl-museum-mast">
      <span class="rlm-brand" data-testid="rl-museum-brand">The Fenwick</span>
      <span class="rlm-crumb" data-testid="rl-museum-crumb">Collection <i>/</i> Object of the month</span>
      <span class="rlm-where" data-testid="rl-museum-where">Gallery 3</span>
    </header>

    <div class="rlm-body">
      <div class="rl-stage rl-grab" data-testid="rl-stage">
        <canvas data-testid="rl-canvas"></canvas>
        <span class="rl-status" data-testid="rl-status">loading…</span>
        <span class="rl-hint" data-testid="rl-hint">drag to turn</span>
      </div>

      <div class="rlm-col" data-testid="rl-museum-col">
        <div>
          <span class="rlm-eyebrow" data-testid="rl-museum-eyebrow">Sculpture · marble · after the antique</span>
          <h3 class="rlm-title" data-testid="rl-museum-title">Portrait bust of a man</h3>
          <p class="rlm-sub" data-testid="rl-museum-sub">Scanned in the round, tooling marks and all.</p>
        </div>

        <div class="rlm-row" data-testid="rl-museum-light">
          <span class="rlm-k">Light</span>
          <div class="rlp-opts" data-opt="rig">
            <button class="rlp-opt rl-on" data-val="gallery" data-testid="rl-museum-rig-gallery">Gallery</button>
            <button class="rlp-opt" data-val="daylight" data-testid="rl-museum-rig-daylight">Daylight</button>
            <button class="rlp-opt" data-val="raking" data-testid="rl-museum-rig-raking">Raking</button>
          </div>
        </div>

        <div data-testid="rl-museum-notes">
          <span class="rlm-k">Look closer</span>
          <ul class="rlp-notes" data-chapters="museum">
            <li><button class="rl-ch rl-on" data-ch="0" data-testid="rl-museum-ch-0"><span class="rl-ch-n">01</span><span class="rl-ch-t">The brow</span><span class="rl-ch-p">Tool grain the polish lost, kept in the normal map.</span></button></li>
            <li><button class="rl-ch" data-ch="1" data-testid="rl-museum-ch-1"><span class="rl-ch-n">02</span><span class="rl-ch-t">The chin</span><span class="rl-ch-p">An old fill, smoother than the stone around it.</span></button></li>
            <li><button class="rl-ch" data-ch="2" data-testid="rl-museum-ch-2"><span class="rl-ch-n">03</span><span class="rl-ch-t">The drapery</span><span class="rl-ch-p">Folds only a raking light separates. Try it.</span></button></li>
          </ul>
        </div>

        <div class="rlm-cta" data-testid="rl-museum-actions">
          <button class="rlp-cta" data-testid="rl-museum-visit">Plan a visit</button>
          <button class="rlp-opt" data-testid="rl-museum-save">Save to my collection</button>
        </div>
      </div>
    </div>

    <footer class="rlm-foot" data-testid="rl-museum-foot"><span>Accession F.1902.14 (invented)</span><span data-testid="rl-museum-attrib">Marble Bust 01 · Poly Haven · CC0</span></footer>
  </div>
</div>
