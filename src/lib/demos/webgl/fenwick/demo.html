<!-- The Fenwick · object in the round — the homepage hero's points and the
     museum page's lit mesh, combined into one housed experience for the
     864 × 444 slide well (2026-09-17). Sources: fenwick-hero, fenwick-museum. -->
<div class="fw" data-testid="fw-world">
  <div class="fw-housing" data-testid="fw-housing">
    <i class="fw-screw fw-screw-tl" aria-hidden="true"></i><i class="fw-screw fw-screw-tr" aria-hidden="true"></i>
    <i class="fw-screw fw-screw-bl" aria-hidden="true"></i><i class="fw-screw fw-screw-br" aria-hidden="true"></i>

    <header class="fw-head" data-testid="fw-head">
      <span class="fw-plate" data-testid="fw-plate"><i class="fw-led" aria-hidden="true"></i>The Fenwick <b>·</b> object in the round</span>
      <span class="fw-phase" data-testid="fw-phase">loading the scan…</span>
    </header>

    <div class="fw-rack">
      <div class="fw-stage" data-testid="fw-stage">
        <canvas data-testid="fw-canvas"></canvas>
        <span class="fw-status" data-testid="fw-status" hidden></span>
        <span class="fw-hint" data-testid="fw-hint">drag to turn</span>
      </div>

      <aside class="fw-panel" data-testid="fw-panel">
        <div>
          <span class="fw-eyebrow" data-testid="fw-eyebrow">Marble · Gallery 3</span>
          <h3 class="fw-title" data-testid="fw-title">Portrait bust of a man</h3>
        </div>

        <div class="fw-group" data-testid="fw-light">
          <span class="fw-k" data-testid="fw-light-label">Light</span>
          <div class="fw-opts">
            <button type="button" class="fw-opt fw-on" data-val="gallery" data-testid="fw-rig-gallery">Gallery</button>
            <button type="button" class="fw-opt" data-val="daylight" data-testid="fw-rig-daylight">Daylight</button>
            <button type="button" class="fw-opt" data-val="raking" data-testid="fw-rig-raking">Raking</button>
          </div>
        </div>

        <div class="fw-group" data-testid="fw-notes">
          <span class="fw-k" data-testid="fw-notes-label">Look closer</span>
          <ul class="fw-list">
            <li><button type="button" class="fw-note fw-on" data-ch="0" data-testid="fw-note-0"><span class="fw-note-n">01</span><span class="fw-note-t">The brow</span><span class="fw-note-p">Tool grain the polish lost, kept in the normal map.</span></button></li>
            <li><button type="button" class="fw-note" data-ch="1" data-testid="fw-note-1"><span class="fw-note-n">02</span><span class="fw-note-t">The chin</span><span class="fw-note-p">An old fill, smoother than the stone around it.</span></button></li>
            <li><button type="button" class="fw-note" data-ch="2" data-testid="fw-note-2"><span class="fw-note-n">03</span><span class="fw-note-t">The drapery</span><span class="fw-note-p">Folds only a raking light separates. Try it.</span></button></li>
          </ul>
        </div>

        <footer class="fw-foot" data-testid="fw-foot">
          <button type="button" class="fw-replay" data-testid="fw-replay">Replay the scan</button>
          <span class="fw-credit" data-testid="fw-credit">Marble Bust 01 · Poly Haven · CC0</span>
        </footer>
      </aside>
    </div>
  </div>
</div>
