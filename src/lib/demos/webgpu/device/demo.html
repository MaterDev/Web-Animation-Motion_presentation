<div class="dv" data-testid="dv-card">
  <canvas class="dv-canvas" data-testid="dv-canvas" aria-label="iPhone Duo, drawn with WebGPU"></canvas>
  <div class="dv-side" data-testid="dv-side">
    <b class="dv-cap-name" data-testid="dv-cap-name">iPhone Duo</b>
    <span class="dv-cap-line" data-testid="dv-cap-line">the hardware is sphere-traced too — press Open</span>
    <span class="dv-bytes" data-testid="loop-strip"><b data-testid="loop-bytes">—</b> state / frame</span>
  </div>
  <div class="dv-ctl" data-testid="dv-controls">
    <button class="dv-btn dv-btn-quiet" data-testid="dv-home" type="button" hidden>Home</button>
    <button class="dv-btn" data-testid="dv-open" type="button" aria-pressed="false" disabled>Open</button>
  </div>
  <span class="dv-loading" data-testid="dv-loading" hidden>opening…</span>
  <span class="gp-status" data-testid="dv-status">requesting a device…</span>
</div>
