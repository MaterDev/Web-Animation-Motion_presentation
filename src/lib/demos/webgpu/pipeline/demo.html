<div class="ck" data-testid="ck-card">
  <div class="gp-stage" data-testid="ck-stage">
    <canvas data-testid="ck-canvas"></canvas>
    <span class="ck-chip" data-testid="ck-chip"><b>200 000</b> particles · one storage buffer</span>
    <span class="gp-status" data-testid="ck-status">requesting a device…</span>
  </div>
  <div class="ck-panel" data-testid="ck-panel">
    <div class="ck-head">
      <span class="ck-k" data-testid="ck-heading">one frame · four passes</span>
      <span class="ck-unit" aria-hidden="true">ms</span>
    </div>
    <div class="ck-passes">
      <label class="ck-pass" data-testid="ck-pass-0"><input type="checkbox" checked data-pass="0" data-testid="ck-p0"><span class="ck-name">flow field</span><span class="ck-ms" data-testid="ck-ms-0">—</span><span class="ck-bar"><i data-testid="ck-bar-0"></i></span></label>
      <label class="ck-pass" data-testid="ck-pass-1"><input type="checkbox" checked data-pass="1" data-testid="ck-p1"><span class="ck-name">integrate</span><span class="ck-ms" data-testid="ck-ms-1">—</span><span class="ck-bar"><i data-testid="ck-bar-1"></i></span></label>
      <label class="ck-pass" data-testid="ck-pass-2"><input type="checkbox" checked data-pass="2" data-testid="ck-p2"><span class="ck-name">density · atomics</span><span class="ck-ms" data-testid="ck-ms-2">—</span><span class="ck-bar"><i data-testid="ck-bar-2"></i></span></label>
      <label class="ck-pass is-fixed" data-testid="ck-pass-3"><input type="checkbox" checked disabled data-pass="3" data-testid="ck-p3"><span class="ck-name">render</span><span class="ck-ms" data-testid="ck-ms-3">—</span><span class="ck-bar"><i data-testid="ck-bar-3"></i></span></label>
    </div>
    <div class="ck-sum" data-testid="ck-sum">
      <span class="ck-k">GPU time · this frame</span>
      <b class="ck-big" data-testid="ck-total">—</b>
      <span class="ck-stack" data-testid="ck-stack"><i data-testid="ck-stack-0"></i><i data-testid="ck-stack-1"></i><i data-testid="ck-stack-2"></i><i data-testid="ck-stack-3"></i></span>
    </div>
    <div class="ck-row" data-testid="ck-bytes-row">
      <span class="ck-k">bytes uploaded</span>
      <span class="ck-val"><b data-testid="ck-bytes">—</b> <span class="ck-kind" data-testid="ck-bytes-kind"></span></span>
    </div>
    <div class="ck-note" data-testid="ck-note"><span data-testid="ck-adapter">…</span> · median of 8</div>
  </div>
</div>
