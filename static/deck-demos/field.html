<!doctype html><meta charset="utf-8"><title>field</title>
<style>
  html,body{margin:0;height:100%;background:transparent;overflow:hidden}
  canvas{display:block;width:100%;height:100%}
</style>
<canvas id="c"></canvas>
<script>
/* FILLER DEMO — a particle field.

   Runs in its own document, which is the point. Its globals, its
   listeners and its animation frame belong to this context and
   nobody else's, so nothing it does can reach another slide. When the
   surface drops the frame the whole context goes with it — there is
   no "pause", and no leaked GPU context to account for later.

   This is also the shape the real technique sheets already have, so
   pointing a slide at design/techniques/… later changes the URL and
   nothing else. */
(function () {
  var p = new URLSearchParams(location.search);
  var tint = p.get('tint') || '#8899aa';
  var n = +(p.get('n') || 420);
  var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  var c = document.getElementById('c'), ctx = c.getContext('2d');
  var dpr = Math.min(2, devicePixelRatio || 1), w = 0, h = 0, pts = [];

  function size() {
    w = innerWidth; h = innerHeight;
    c.width = Math.round(w * dpr); c.height = Math.round(h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    pts = Array.from({ length: n }, function () {
      return { x: Math.random() * w, y: Math.random() * h,
               vx: (Math.random() - 0.5) * 0.34, vy: (Math.random() - 0.5) * 0.34,
               r: 0.6 + Math.random() * 1.5 };
    });
  }
  addEventListener('resize', size); size();

  function draw() {
    ctx.clearRect(0, 0, w, h); ctx.fillStyle = tint;
    for (var i = 0; i < pts.length; i++) {
      var q = pts[i];
      if (!reduce) {
        q.x += q.vx; q.y += q.vy;
        if (q.x < 0 || q.x > w) q.vx *= -1;
        if (q.y < 0 || q.y > h) q.vy *= -1;
      }
      ctx.globalAlpha = 0.25 + (q.r / 2.1) * 0.6;
      ctx.beginPath(); ctx.arc(q.x, q.y, q.r, 0, 6.2832); ctx.fill();
    }
    ctx.globalAlpha = 1;
    if (!reduce) requestAnimationFrame(draw);
  }
  draw();
  parent.postMessage({ deck: 'ready' }, '*');
})();
</script>
